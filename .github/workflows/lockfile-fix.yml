name: Fix dependabot lockfile

# Dependabot's npm ecosystem updates package.json but not bun.lock, so its
# PRs fail `bun install --frozen-lockfile` in CI. This workflow regenerates
# the lockfile when Dependabot pushes to a dependabot branch and commits the
# change back to that branch.
#
# Runs on `push` to dependabot branches - the same trust domain as the branch
# author, so there is no privileged context (unlike `pull_request_target`,
# which would check out untrusted PR code with a write-capable token). Only
# bun.lock is committed, `bun install --ignore-scripts` never executes
# dependency install scripts, and the explicit `permissions` block restores
# write access that Dependabot-triggered runs would otherwise lack.
on:
  push:
    branches:
      - "dependabot/**"

permissions:
  contents: write

concurrency:
  group: fix-lockfile-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate bun.lock
        run: bun install --ignore-scripts

      - name: Commit and push lockfile changes
        run: |
          if ! git diff --quiet bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: update bun.lock"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"
          fi
